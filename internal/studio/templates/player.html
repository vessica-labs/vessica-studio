<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--VSTD:TITLE--></title>
<style>

/* ============================================================
   VESSICA STUDIO PLAYER — the engine-owned control plane.
   This file is embedded in the vstd binary and used for EVERY
   theme; themes contribute theme.css + deck.css only. HUD
   behavior and styling are invariant by design — the chrome
   below uses engine-owned --vstd-* tokens that themes must not
   redefine. Canvas: 16:9 → 1280×720 px base (96 px = 1 inch).
   ============================================================ */

:root{
  --vstd-deep:#0C2B15; --vstd-green:#21BF61; --vstd-teal:#18A8AF; --vstd-mint:#20E3AC;
  --vstd-off:#FCFBFA; --vstd-gray:#575757;
  --vstd-serif:Georgia,serif;
  --vstd-sans:"Trebuchet MS",Verdana,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111614;font-family:var(--vstd-sans)}

/* ---------- Stage & scaling ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{width:1280px;height:720px;position:relative;flex:0 0 auto;box-shadow:0 12px 60px rgba(0,0,0,.5)}
.slide{display:none}
.slide.active{display:block!important}
.slide.active{display:block}
.notes{display:none}
.slide .pgpill{position:absolute;right:44px;bottom:12px;z-index:8;font:14px var(--vstd-sans);color:#a8b6ab;border:1px solid #4d6252;border-radius:999px;padding:2px 9px;line-height:1.2}

/* ---------- Viewer chrome ---------- */
#hud{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;
  background:rgba(12,20,15,.82);border:1px solid #2c4a35;border-radius:999px;padding:6px 12px;z-index:60;
  opacity:0;transition:opacity .25s}
body:hover #hud{opacity:1}
#hud button{background:none;border:none;color:#cfe6d4;font-family:var(--vstd-sans);font-size:13px;cursor:pointer;
  padding:4px 10px;border-radius:999px;white-space:nowrap}
#hud button:hover{background:#1c4229}
#hud .cnt{color:#8fb59a;font-size:12px;padding:0 6px;min-width:70px;text-align:center}
#hudmore{display:none;position:absolute;bottom:48px;right:0;flex-direction:column;gap:2px;
  background:rgba(12,20,15,.96);border:1px solid #2c4a35;border-radius:16px;padding:8px;min-width:150px}
#hudmore.open{display:flex}
#hudmore button{text-align:left;padding:11px 16px;font-size:16px}
#downloadMenu{display:none;position:absolute;bottom:48px;right:42px;flex-direction:column;gap:3px;
  background:rgba(12,20,15,.97);border:1px solid #2c4a35;border-radius:14px;padding:7px;min-width:178px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
#downloadMenu.open{display:flex}
#downloadMenu button{text-align:left;padding:9px 13px;font-size:13px}
#downloadMenu small{display:block;color:#86a78e;font-size:10px;font-weight:400;margin-top:2px}
#downloadbtn svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#shareDialog{position:fixed;inset:0;z-index:155;display:none;align-items:center;justify-content:center;background:rgba(5,13,8,.68);backdrop-filter:blur(3px);font-family:var(--vstd-sans)}
#shareDialog.open{display:flex}
#shareDialog .card{width:min(520px,calc(100vw - 32px));background:var(--vstd-off);color:var(--vstd-deep);border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
#shareDialog .shead{display:flex;align-items:center;gap:12px;margin-bottom:8px}#shareDialog h2{font:400 28px var(--vstd-serif);flex:1}
#shareDialog .close{border:0;background:transparent;color:var(--vstd-gray);font-size:22px;cursor:pointer;padding:4px 8px}
#shareDialog p{font-size:14px;line-height:1.45;color:var(--vstd-gray);margin-bottom:18px}
#shareDialog label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;margin:12px 0 6px}
#shareDialog select,#shareDialog input{width:100%;border:1px solid #bdcbbf;border-radius:9px;background:#fff;color:var(--vstd-deep);font:14px var(--vstd-sans);padding:11px 12px}
#shareDialog .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#shareDialog .actions button{border:1px solid #abc0af;border-radius:999px;background:#fff;color:var(--vstd-deep);font:700 13px var(--vstd-sans);padding:10px 17px;cursor:pointer}
#shareDialog .actions .primary{background:var(--vstd-deep);border-color:var(--vstd-deep);color:#fff}
#shareDialog .meta{min-height:18px;margin-top:8px;color:#5d7563;font-size:12px}
/* touch devices: hud always visible, bigger targets, secondary items behind ⋯ */
body.mobilehud #hud{opacity:1;gap:2px;padding:8px 10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:96vw}
body.mobilehud #hud>button{font-size:16px;padding:9px 13px}
body.mobilehud #hud .cnt{font-size:14px;min-width:52px}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--vstd-green);z-index:70;transition:width .2s}
#toast{position:fixed;top:14px;right:14px;z-index:120;background:rgba(12,32,19,.95);color:#dff0e2;
  border:1px solid #21BF61;border-radius:12px;padding:10px 18px;font-family:var(--vstd-sans);font-size:14px;
  display:none;max-width:340px}
/* ---------- Vessica presentation mode ---------- */
#vstatus{position:fixed;top:14px;left:14px;z-index:120;display:none;align-items:center;gap:9px;
  background:rgba(12,32,19,.92);border:1px solid #2c4a35;border-radius:999px;padding:7px 16px;
  font-family:var(--vstd-sans);font-size:13px;color:#cfe6d4;cursor:pointer}
#vstatus .dot{width:10px;height:10px;border-radius:50%;background:#575757}
#vstatus.listening .dot{background:#21BF61;animation:vpulse 1.6s infinite}
#vstatus.speaking .dot{background:#20E3AC;animation:vpulse .7s infinite}
#vstatus.connecting .dot{background:#FEA127;animation:vpulse 1s infinite}
#vstatus.error .dot{background:#FE7C2B}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.35}}
.vglow{outline:3px solid rgba(32,227,172,.0);border-radius:12px;
  box-shadow:0 0 0 3px rgba(32,227,172,.55),0 0 34px 6px rgba(32,227,172,.45);
  transition:box-shadow .3s ease;animation:vglowp 1.8s ease-in-out infinite}
#vprog{position:fixed;left:0;top:0;right:0;height:3px;z-index:130;display:none;background:rgba(32,227,172,.14)}
#vprog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#20E3AC;overflow:hidden;transition:width .6s ease}
#vprog .fill::after{content:'';position:absolute;left:-40%;width:40%;top:0;bottom:0;
  background:linear-gradient(90deg,transparent,#96F977,transparent);animation:vprogslide 1.6s linear infinite}
@keyframes vprogslide{to{left:140%}}
#vproglabel{position:fixed;top:9px;left:50%;transform:translateX(-50%);z-index:130;display:none;
  background:rgba(12,43,21,.85);color:#c9f5d3;font:12px var(--vstd-sans);border-radius:999px;padding:3px 14px;pointer-events:none}
#capbar{position:fixed;top:34px;left:50%;transform:translateX(-50%);z-index:131;display:none;align-items:center;gap:12px;
  background:#3a2c0d;border:1.5px solid #FEA127;color:#FFE9B8;border-radius:999px;padding:6px 8px 6px 18px;font:12.5px var(--vstd-sans)}
#capbar button{background:#FEA127;color:#3d2c05;border:none;border-radius:999px;padding:5px 14px;font:700 12px var(--vstd-sans);cursor:pointer}
#capbar button:hover{background:#ffb54a}
#overview .thumb .tprog{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(32,227,172,.3);z-index:5}
#overview .thumb .tprog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#20E3AC;overflow:hidden}
#overview .thumb .tprog .fill::after{content:'';position:absolute;left:-40%;width:40%;top:0;bottom:0;
  background:linear-gradient(90deg,transparent,#96F977,transparent);animation:vprogslide 1.6s linear infinite}
#hudSticky.pending{color:#FEA127!important;font-weight:700}
#stickyPad{position:fixed;left:50%;bottom:64px;z-index:106;width:340px;background:#FFF8C9;border-radius:4px;
  box-shadow:0 14px 40px rgba(0,0,0,.35);padding:16px;transform:translateX(-50%) rotate(-1deg);display:none;font-family:var(--vstd-sans)}
#stickyPad h4{margin:0 0 8px;font-size:13px;color:#7a5a10;letter-spacing:.08em}
.stickyref{outline:2.5px dashed #FEA127!important;outline-offset:3px;border-radius:4px}
#stickyPad .ref{display:none;align-items:center;gap:8px;background:#FEA127;color:#3d2c05;border-radius:6px;
  padding:5px 10px;font-size:11.5px;margin-bottom:8px;font-weight:600}
#stickyPad .ref span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stickyPad .ref b{cursor:pointer;font-size:14px;line-height:1}
#stickyPad .aim{font-size:10.5px;color:#a08c3e;margin-bottom:6px}
#stickyPad .open-notes{max-height:110px;overflow:auto;margin-bottom:8px}
#stickyPad .open-notes div{font-size:11.5px;color:#6b5a20;border-left:3px solid #E0C24A;padding:3px 8px;margin-bottom:4px;background:#fffce3}
#stickyPad textarea{width:100%;box-sizing:border-box;height:92px;border:1px dashed #d8bd52;background:#fffdf0;border-radius:4px;
  padding:8px;font:14px var(--vstd-sans);color:#3d3208;resize:vertical;outline:none}
#stickyPad .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
#stickyPad .hint{font-size:10.5px;color:#a08c3e}
#stickyPad button{background:#0C2B15;color:#E3FDDB;border:none;border-radius:999px;padding:7px 18px;font:600 13px var(--vstd-sans);cursor:pointer}
#companionDrawer{position:fixed;right:0;top:0;bottom:0;z-index:145;width:min(560px,94vw);background:#f8faf8;color:#14251a;
  box-shadow:-18px 0 55px rgba(0,0,0,.34);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;font-family:var(--vstd-sans)}
#companionDrawer.open{transform:translateX(0)}
#companionDrawer .chead{display:flex;align-items:center;gap:10px;padding:15px 18px;background:#0c2b15;color:#e3fddb;border-bottom:1px solid #2c4a35}
#companionDrawer .ctitle{font-size:16px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#companionDrawer button,#companionDrawer .attachbtn{border:1px solid #2c4a35;background:#fff;color:#0c2b15;border-radius:999px;padding:7px 13px;font:700 12px var(--vstd-sans);cursor:pointer}
#companionDrawer .chead button{background:transparent;color:#e3fddb;border-color:#54735e}
#companionDrawer .tabs{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #d7e1d9;background:#eef4ef}
#companionDrawer .tabs button.active{background:#0c2b15;color:#fff}
#companionDrawer .attachments{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #d7e1d9;background:#fff}
#companionDrawer .attachments a{display:inline-flex;gap:5px;align-items:center;padding:6px 10px;border-radius:999px;background:#e3fddb;color:#0c2b15;text-decoration:none;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#companionDrawer .attachbtn input{display:none}
#companionDrawer .cbody{position:relative;flex:1;min-height:0}
#companionDrawer .preview,#companionDrawer textarea{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;overflow:auto}
#companionDrawer .preview{padding:18px 24px 80px;line-height:1.5;font-size:15px}
#companionDrawer .preview h1{font-size:28px;margin:4px 0 18px}#companionDrawer .preview h2{font-size:20px;margin:24px 0 9px;color:#0c2b15}#companionDrawer .preview h3{font-size:17px}
#companionDrawer .preview p{margin:8px 0}#companionDrawer .preview ul{padding-left:22px}#companionDrawer .preview li{margin:5px 0}#companionDrawer .preview code{background:#e8eeea;border-radius:4px;padding:2px 5px}
#companionDrawer .preview .frontmatter{font:12px ui-monospace,monospace;background:#edf2ee;border:1px solid #d7e1d9;border-radius:8px;padding:10px;white-space:pre-wrap;color:#54705c}
#companionDrawer textarea{display:none;resize:none;border:0;outline:0;padding:18px 20px 90px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#14251a;background:#fbfdfb;tab-size:2}
#companionDrawer.editing textarea{display:block}#companionDrawer.editing .preview{display:none}
#companionDrawer .cfoot{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid #d7e1d9;background:#fff}
#companionDrawer .cstate{flex:1;font-size:12px;color:#65776a}#companionDrawer .save{background:#0c2b15;color:#fff}
#dictbar{position:fixed;left:0;right:0;bottom:0;z-index:110;display:none;align-items:center;gap:16px;
  background:rgba(12,32,19,.96);border-top:2px solid #20E3AC;padding:12px 22px;font-family:var(--vstd-sans)}
#dictbar .dot{width:12px;height:12px;border-radius:50%;background:#20E3AC;animation:vpulse 1.4s infinite;flex:0 0 12px}
#dictbar .dlabel{color:#20E3AC;font-size:14px;font-weight:700;white-space:nowrap}
#dictbar .dtrans{color:#cfe6d4;font-size:14px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-style:italic}
#dictbar .dact{color:#8fb59a;font-size:12px;white-space:nowrap}
#dictbar button{background:none;border:1px solid #2c4a35;color:#cfe6d4;border-radius:999px;
  padding:6px 16px;font-size:13px;cursor:pointer;font-family:var(--vstd-sans)}
#dictbar button:hover{background:#1c4229}
.draft-pill{position:absolute;right:44px;top:16px;border:1.5px dashed #FEA127;border-radius:999px;
  padding:3px 14px;font-size:13px;color:#b06c0e;background:#fff9f0;font-family:var(--vstd-sans)}
#followchip{position:fixed;top:12px;right:12px;z-index:120;display:none;
  background:rgba(12,32,19,.94);border:1px solid #21BF61;border-radius:999px;padding:5px 10px;
  max-width:calc(100vw - 24px);font-family:var(--vstd-sans);font-size:11px;font-weight:700;letter-spacing:.04em;
  color:#cfe6d4;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.24);transition:padding .18s,font-size .18s}
#followchip.intro{padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:0}
#followchip.paused{border-color:#FEA127}
@keyframes vglowp{0%,100%{box-shadow:0 0 0 3px rgba(32,227,172,.55),0 0 34px 6px rgba(32,227,172,.45)}
  50%{box-shadow:0 0 0 3px rgba(32,227,172,.85),0 0 48px 10px rgba(32,227,172,.65)}}
#menu,#notesPanel{position:fixed;z-index:80;background:#0f271733;backdrop-filter:blur(2px)}
#menu{inset:0;display:none}
#menu.open{display:flex;align-items:center;justify-content:center}
#menu .sheet{background:var(--vstd-off);border-radius:16px;padding:34px 40px;width:760px;max-height:82vh;overflow:auto}
#menu h2{font-family:var(--vstd-serif);font-weight:400;color:var(--vstd-deep);font-size:30px;margin-bottom:14px}
#menu a{display:flex;gap:14px;align-items:baseline;text-decoration:none;color:var(--vstd-gray);font-size:15px;
  padding:8px 4px;border-bottom:1px solid #e2e0da;cursor:pointer}
#menu a:hover{color:var(--vstd-deep)}
#menu a .n{color:var(--vstd-green);font-size:13px;min-width:28px}
#notesPanel{left:0;right:0;bottom:0;background:rgba(12,32,19,.94);color:#dff0e2;display:none;
  padding:16px 26px 20px;font-size:15px;line-height:1.5;max-height:32vh;overflow:auto;border-top:2px solid var(--vstd-green)}
#notesPanel.open{display:block}
#notesPanel .lbl{color:var(--vstd-mint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
#overview{position:fixed;inset:0;background:#111614;z-index:90;display:none;overflow:auto;padding:30px}
#overview.open{display:block}
#overview .gridwrap{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
#ovbar{position:sticky;top:-30px;z-index:12;display:flex;align-items:center;gap:14px;margin:-10px 0 18px;
  background:rgba(17,22,20,.94);border:1px solid #2c4a35;border-radius:10px;padding:10px 18px;width:fit-content}
#ovbar label{color:#8fb59a;font:12px var(--vstd-sans);letter-spacing:.08em}
#ovbar input[type=range]{width:170px;accent-color:#20E3AC}
#ovbar .zi{color:#cfe6d4;font-size:15px}
#overview .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:6px;cursor:pointer;outline:2px solid transparent}
#overview .thumb:hover{outline-color:var(--vstd-green)}
#overview .thumb.hiddenSlide .mini{opacity:.32;filter:grayscale(.5)}
#overview .thumb.hiddenSlide::after{content:'HIDDEN';position:absolute;top:6px;left:6px;background:rgba(12,43,21,.85);
  color:#FEA127;font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:4px;padding:2px 8px;z-index:6}
#overview .thumb .eye{position:absolute;top:4px;right:4px;z-index:7;background:rgba(12,43,21,.85);border:1px solid #3d5c46;
  color:#cfe6d4;border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer;opacity:0;transition:opacity .15s}
#overview .thumb:hover .eye{opacity:1}
#overview .thumb.dragover{outline:2px dashed var(--vstd-mint);outline-offset:2px}
#overview .thumb.dragging{opacity:.4}
#overview .thumb.selected{outline:2.5px solid var(--vstd-mint);outline-offset:2px}
#overview .thumb.selected::before{content:'✓';position:absolute;top:6px;right:34px;z-index:8;background:var(--vstd-mint);
  color:#06140c;font-weight:700;font-size:12px;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
#overview .ovbreak{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:22px 0 4px;color:#FEA127;
  font:700 12px var(--vstd-sans);letter-spacing:.14em;padding:10px 0;border-radius:8px}
#overview .ovbreak::before,#overview .ovbreak::after{content:'';flex:1;border-top:1.5px dashed #7a5a2b}
#overview .ovbreak.dragover{background:rgba(254,161,39,.12);outline:2px dashed #FEA127}
#overview .thumb.parkedSlide .mini{opacity:.45;filter:saturate(.4)}
#overview .thumb.parkedSlide .cap{color:#FEA127}
#overview .thumb .mini{width:1280px;height:720px;transform:scale(var(--ts));transform-origin:top left;position:absolute;top:0;left:0;pointer-events:none}
#overview .thumb .cap{position:absolute;left:6px;bottom:4px;background:rgba(12,43,21,.85);color:#dff0e2;font-size:11px;
  padding:2px 8px;border-radius:999px;z-index:5}
/* ---------- Edit mode ---------- */
body.editmode #frame{outline:2px dashed rgba(33,191,97,.5);outline-offset:4px}
#editRibbon{position:fixed;left:0;right:0;top:0;z-index:140;min-height:62px;display:none;align-items:center;gap:8px;
  box-sizing:border-box;padding:8px 12px;background:rgba(12,32,19,.98);border-bottom:1px solid #36533e;
  box-shadow:0 6px 20px rgba(0,0,0,.28);font-family:var(--vstd-sans);overflow-x:auto;white-space:nowrap}
body.editmode #editRibbon{display:flex}
body.editmode #stage{top:62px}
#editRibbon .rbrand{align-self:stretch;display:flex;align-items:center;padding:0 12px 0 4px;color:var(--vstd-mint);
  border-right:1px solid #36533e;font-size:14px;font-weight:800;letter-spacing:.04em}
#editRibbon .rselection{min-width:112px;max-width:180px;overflow:hidden;text-overflow:ellipsis;color:#dff0e2;font-size:12px}
#editRibbon .etools,#videoRibbonTools{display:flex;align-items:center;gap:5px}
#editRibbon .rsep{width:1px;height:30px;background:#36533e;margin:0 3px}
#editRibbon button{background:#173c25;color:#dff0e2;border:1px solid #42614a;border-radius:6px;
  padding:6px 10px;font-size:12px;font-family:var(--vstd-sans);cursor:pointer;white-space:nowrap}
#editRibbon button:hover:not(:disabled){background:#245432}
#editRibbon button.on{background:#21BF61;color:#0C2B15;border-color:#21BF61}
#editRibbon button:disabled,#editRibbon .cwrap.disabled{opacity:.35;cursor:default}
#editRibbon .cwrap{display:flex;align-items:center;gap:4px;background:#173c25;color:#dff0e2;
  border:1px solid #42614a;border-radius:6px;padding:3px 6px 3px 9px;font-size:12px;cursor:pointer}
#editRibbon .cwrap input[type=color]{width:23px;height:23px;border:none;border-radius:4px;padding:0;background:none;cursor:pointer}
#editRibbon .cwrap input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
#editRibbon .cwrap input[type=color]::-webkit-color-swatch{border:1px solid #58715e;border-radius:3px}
#editRibbon .rhint{margin-left:auto;color:#86a78e;font-size:11px;padding:0 8px}
#videoRibbonTools{display:none}
#videoRibbonTools .danger{color:#ff9a9a}
@media(max-width:1050px){#editRibbon .rhint{display:none}}
body.editmode section.slide img,body.editmode section.slide video{pointer-events:auto !important}
#snapguides{position:absolute;inset:0;pointer-events:none;z-index:49}
#snapguides .sg{position:absolute;background:var(--vstd-mint);opacity:.85;box-shadow:0 0 4px rgba(32,227,172,.6)}
#snapguides .sg.v{top:0;bottom:0;width:1px}
#snapguides .sg.h{left:0;right:0;height:1px}
#selbox{position:absolute;z-index:50;pointer-events:none;border:1.5px solid var(--vstd-teal);display:none}
#selbox .hnd{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--vstd-teal);
  border-radius:3px;pointer-events:auto}
#selbox .hnd.nw{left:-7px;top:-7px;cursor:nwse-resize}#selbox .hnd.n{left:calc(50% - 6px);top:-7px;cursor:ns-resize}
#selbox .hnd.ne{right:-7px;top:-7px;cursor:nesw-resize}#selbox .hnd.e{right:-7px;top:calc(50% - 6px);cursor:ew-resize}
#selbox .hnd.se{right:-7px;bottom:-7px;cursor:nwse-resize}#selbox .hnd.s{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}
#selbox .hnd.sw{left:-7px;bottom:-7px;cursor:nesw-resize}#selbox .hnd.w{left:-7px;top:calc(50% - 6px);cursor:ew-resize}
body.editmode .slide.active [contenteditable="true"]{outline:2px solid var(--vstd-green);outline-offset:2px;cursor:text}
body.editmode .slide.active{cursor:default}
@media print{
  #hud,#progress,#notesPanel,#menu,#overview,#vprog,#vproglabel,#stickyPad,#companionDrawer,#downloadMenu,#shareDialog,#capbar,#editRibbon{display:none!important}
  #stage{position:static}
  #frame{width:1280px;height:720px;box-shadow:none;page-break-after:always;position:relative;margin:0 auto}
  .slide{display:block!important;position:relative;page-break-after:always}
}

</head>
<body>
<div id="stage"><div id="frame">

<!-- ============ S1 · COVER (gradient) ============ -->
<!--VSTD:SLIDES-->
</div></div>

<div id="progress"></div>
<div id="hud">
  <button data-act="prev">‹ Prev</button>
  <span class="cnt" id="cnt">1 / 1</span>
  <button data-act="next">Next ›</button>
  <button data-act="vessica" id="hudVessica" title="Start/stop Vessica (V)">Vessica</button>
  <button data-act="menu">Agenda</button>
  <button data-act="grid">Grid</button>
  <button data-act="sticky" id="hudSticky">Sticky</button>
  <button data-act="companion" id="companionbtn" style="display:none">Companion</button>
  <button data-act="notes">Notes</button>
  <button data-act="present" id="presentbtn">Present</button>
  <button data-act="share" id="sharebtn" style="display:none">Share</button>
  <button data-act="download" id="downloadbtn" style="display:none" title="Download deck" aria-label="Download deck"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg></button>
  <button id="newslidebtn" style="display:none">+ Slide</button>
  <button data-act="edit" id="editbtn">Edit</button>
  <button data-act="save" id="savebtn" style="display:none;color:#20E3AC">Save now</button>
  <button data-act="more" id="hudMore" style="display:none">⋯</button>
  <div id="downloadMenu"><button data-download="pdf">PDF<small>Fixed-layout document</small></button><button data-download="pptx">PowerPoint (.pptx)<small>Visual-exact slides that mirror the HTML</small></button><button data-download="pptx-editable">PowerPoint — editable objects<small>Best-effort editable text, shapes, and images</small></button></div>
  <div id="hudmore"></div>
</div>
<div id="shareDialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
  <div class="card">
    <div class="shead"><h2 id="shareTitle">Share this presentation</h2><button class="close" type="button" aria-label="Close">&#10005;</button></div>
    <p>Generate a private, expiring link. It grants access to this presentation only.</p>
    <label for="shareTTL">Link expires after</label>
    <select id="shareTTL"><option value="24">24 hours</option><option value="72" selected>3 days</option><option value="168">7 days</option><option value="720">30 days</option></select>
    <label for="shareURL">Share link</label>
    <input id="shareURL" type="text" readonly placeholder="Choose Generate link">
    <div class="meta" id="shareMeta"></div>
    <div class="actions"><button type="button" data-share="generate" class="primary">Generate link</button><button type="button" data-share="copy" disabled>Copy link</button><button type="button" data-share="email" disabled>Email link</button></div>
  </div>
</div>
<div id="editRibbon" role="toolbar" aria-label="Object editing controls">
  <div class="rbrand">Edit</div><div class="rselection" id="editSelection">No object selected</div>
  <div class="etools">
    <button data-e="text" title="Edit text">&#9998; Text</button>
    <button data-e="bold" title="Bold"><b>B</b></button><button data-e="italic" title="Italic"><i>I</i></button><button data-e="under" title="Underline"><u>U</u></button>
    <button data-e="fminus" title="Smaller text">A&#8722;</button><button data-e="fplus" title="Larger text">A+</button>
    <label class="cwrap" title="Text color">A<input type="color" data-c="color" aria-label="Text color"></label>
    <label class="cwrap" title="Object fill color">&#9632;<input type="color" data-c="bg" aria-label="Object fill color"></label>
    <label class="cwrap" title="Object line color">&#9633;<input type="color" data-c="border" aria-label="Object line color"></label>
    <span class="rsep"></span><button data-e="reset" title="Reset position, size and style">Reset</button>
    <button data-e="del" title="Delete this object (Delete key)" style="color:#ff9a9a">Delete</button><button data-e="done">Done</button>
  </div>
  <div id="videoRibbonTools" aria-label="Video controls"></div>
  <div class="rhint" id="edithint">Select an object · drag to move · handles resize · arrows nudge · Alt disables snapping</div>
</div>
<div id="menu"><div class="sheet"><h2>Jump to</h2><div id="menulist"></div></div></div>
<div id="notesPanel"><div class="lbl">Speaker notes</div><div id="notesBody"></div></div>
<div id="vstatus"><span class="dot"></span><span id="vlabel">Vessica off</span></div>
<div id="overview"><div class="gridwrap" id="ovgrid"></div></div>
<aside id="companionDrawer" aria-label="Slide companion">
  <div class="chead"><div class="ctitle">Slide companion</div><button class="cclose" title="Close">&#10005;</button></div>
  <div class="tabs"><button class="previewtab active">Rendered</button><button class="edittab">Edit Markdown</button></div>
  <div class="attachments"><span class="attachlist"></span><label class="attachbtn">+ Source file<input type="file" accept=".pdf,.ppt,.pptx,.png,.jpg,.jpeg,.gif,.webp,.doc,.docx,.xls,.xlsx,.csv"></label></div>
  <div class="cbody"><article class="preview"></article><textarea spellcheck="true" aria-label="Companion Markdown"></textarea></div>
  <div class="cfoot"><span class="cstate">Loaded</span><button class="save">Save companion</button></div>
</aside>

<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  const frame=document.getElementById('frame'),cnt=document.getElementById('cnt');
  const notesPanel=document.getElementById('notesPanel'),notesBody=document.getElementById('notesBody');
  const menu=document.getElementById('menu'),menulist=document.getElementById('menulist');
  const overview=document.getElementById('overview'),ovgrid=document.getElementById('ovgrid');
  const progress=document.getElementById('progress');
	const shareDialog=document.getElementById('shareDialog');
  let cur=0,notesOn=false,scale=1;

  function closeShare(){if(shareDialog)shareDialog.classList.remove('open');}
  function openShare(){
    if(!shareDialog)return;
    shareDialog.classList.add('open');
    setTimeout(()=>document.getElementById('shareTTL').focus(),0);
  }
  async function generateShare(){
    const ttl=parseInt(document.getElementById('shareTTL').value)||72;
    const meta=document.getElementById('shareMeta');
    meta.textContent='Generating a deck-scoped link…';
    try{
      const r=await fetch('/api/deck/'+window.VSTD.deck+'/share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ttl_hours:ttl})});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
      const input=document.getElementById('shareURL');input.value=new URL(j.url,location.origin).href;
      shareDialog.querySelectorAll('[data-share="copy"],[data-share="email"]').forEach(b=>b.disabled=false);
      meta.textContent='Expires '+new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(j.expires_at));
      input.select();
    }catch(e){meta.textContent='Could not generate link: '+e.message;}
  }
  async function copyShare(){
    const input=document.getElementById('shareURL');if(!input.value)return;
    try{await navigator.clipboard.writeText(input.value);}catch(_){input.select();document.execCommand('copy');}
    toast('Presentation link copied');
  }
  function emailShare(){
    const link=document.getElementById('shareURL').value;if(!link)return;
    const title=(window.VSTD&&window.VSTD.title)||document.title||'Presentation';
    location.href='mailto:?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent('Here is the presentation link:\n\n'+link+'\n\nThis link grants access only to this presentation.');
  }
  if(shareDialog){
    shareDialog.addEventListener('click',e=>{
      if(e.target===shareDialog||e.target.closest('.close')){closeShare();return;}
      const act=e.target.closest('[data-share]')&&e.target.closest('[data-share]').dataset.share;
      if(act==='generate')generateShare();else if(act==='copy')copyShare();else if(act==='email')emailShare();
    });
  }

  // page numbers: only in-flow (non-parked) slides are numbered
  function renumberPills(){
    let n=0;
    slides.forEach(s=>{
      const parked=s.hasAttribute('data-parked');
      if(!parked)n++;
      const p=s.querySelector('.pgpill');
      if(p)p.textContent=parked?'·':n;
    });
  }
  renumberPills();
  function visIdx(){return slides.map((s,i)=>i).filter(i=>!slides[i].hasAttribute('data-parked'));}
  function dispNum(i){const k=visIdx().indexOf(i);return k<0?0:k+1;}

  function fit(){
    const ribbon=document.body.classList.contains('editmode')?62:0;
    scale=Math.min(innerWidth/1280,(innerHeight-ribbon)/720)*0.985;
    frame.style.transform=`scale(${scale})`;frame.style.transformOrigin='center center';
  }
  addEventListener('resize',fit);fit();

  function canEditDeck(){return !window.__vme||window.__vme.editable===true;}
  window.__vcanEdit=canEditDeck;
  function persistSlide(sec){
    if(!canEditDeck())return;
    if(!sec.dataset.vstd||!window.VSTD)return;
    return saveSlide(sec).then(res=>{
      if(res.status==='conflict')toast('⚠ Not saved — slide '+res.id+' changed on disk after this page loaded. Reload to pick it up, then re-apply.',8500);
      return res;
    });
  }
  function show(i){
    stopTextEdit();clearSel();
    cur=Math.max(0,Math.min(slides.length-1,i));
    const tgt=slides[cur];
    if(tgt.hasAttribute('data-hidden')){ // direct navigation to a hidden slide unhides it
      tgt.removeAttribute('data-hidden');persistSlide(tgt);toast('Slide '+(cur+1)+' unhidden');
    }
    slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
    const vn=dispNum(cur),vt=visIdx().length;
    cnt.textContent=(vn||'·')+' / '+vt;
    document.dispatchEvent(new CustomEvent('vstd:slide',{detail:{index:cur}}));
    progress.style.width=(vn?vn/vt*100:0)+'%';
    location.hash='#/'+(cur+1);
    const n=slides[cur].querySelector('.notes');
    notesBody.innerHTML=n?n.innerHTML:'<em>No notes.</em>';
  }
  function goto(id){const ix=slides.findIndex(s=>s.dataset.id===id);if(ix>=0)show(ix);}
  // step: relative navigation skips hidden slides
  function step(d){
    let i=cur;
    for(let k=0;k<slides.length;k++){
      i+=d;
      if(i<0||i>=slides.length)return;
      if(!slides[i].hasAttribute('data-hidden')&&!slides[i].hasAttribute('data-parked')){show(i);return;}
    }
  }

  // agenda-row links (disabled while editing)
  document.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click',()=>{if(editMode)return;menu.classList.remove('open');goto(a.dataset.goto);}));

  // menu build from section markers
  slides.forEach((s,i)=>{
    if(s.dataset.menu){
      const a=document.createElement('a');
      a.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+s.dataset.menu+'</span>';
      a.addEventListener('click',()=>{menu.classList.remove('open');show(i);});
      menulist.appendChild(a);
    }
  });

  // overview grid (rebuilt each open so edits show up)
  let dragSrc=null;
  const ovSel=new Set(); // multi-select (vstd ids)
  // edge auto-scroll while dragging in the grid
  let ovAuto=0,ovRAF=null;
  function ovLoop(){if(ovAuto)overview.scrollTop+=ovAuto;ovRAF=requestAnimationFrame(ovLoop);}
  function ovAutoStart(){if(!ovRAF)ovLoop();}
  function ovAutoStop(){if(ovRAF)cancelAnimationFrame(ovRAF);ovRAF=null;ovAuto=0;}
  overview.addEventListener('dragover',e=>{
    const m=110;
    if(e.clientY<m)ovAuto=-Math.ceil((m-e.clientY)/5);
    else if(e.clientY>innerHeight-m)ovAuto=Math.ceil((e.clientY-(innerHeight-m))/5);
    else ovAuto=0;
  });
  function selOrdered(){return slides.filter(x=>ovSel.has(x.dataset.vstd)).map(x=>x.dataset.vstd);}
  async function moveSeq(ids,after){
    let a=after;
    for(const id of ids){
      window.__selfSave=Date.now(); // suppress watcher-triggered reload during the operation
      const r=await fetch('/api/deck/'+window.VSTD.deck+'/slide/'+id+'/move',
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({after:a})});
      if(!r.ok)throw new Error(await r.text());
      a=(await r.json()).id;
      window.__selfSave=Date.now();
    }
  }
  async function setParked(ids,park){
    for(const id of ids){
      const sec=slides.find(x=>x.dataset.vstd===id);
      if(!sec)continue;
      if(park)sec.setAttribute('data-parked','1');else sec.removeAttribute('data-parked');
      await persistSlide(sec);
    }
  }
  async function dropSel(target){ // {type:'after'|'front'|'park', id?}
    let ids=selOrdered();
    if(!ids.length&&dragSrc)ids=[dragSrc];
    dragSrc=null;
    if(!ids.length)return;
    if(target.type==='after'&&ids.indexOf(target.id)>=0)return;
    try{
      // set BEFORE any API call: if the engine's change-broadcast reload wins
      // the race, we still come back in Grid view, at this scroll and zoom
      location.hash='#/grid@'+Math.round(overview.scrollTop)+'@'+ovCols;
      window.__selfSave=Date.now();
      if(target.type==='park'){
        await setParked(ids,true);
        toast(ids.length+' slide(s) parked');
      }else{
        await setParked(ids,false);
        await moveSeq(ids,target.type==='front'?'':target.id);
        toast(ids.length+' slide(s) moved');
      }
      ovSel.clear();
      location.hash='#/grid';
      setTimeout(()=>location.reload(),350);
    }catch(err){toast('Move failed: '+err.message);}
  }
  let ovCols=4;
  function ensureOvBar(){
    if(document.getElementById('ovbar'))return;
    const bar=document.createElement('div');bar.id='ovbar';
    bar.innerHTML='<label>ZOOM</label><span class="zi">−</span>'+
      '<input type="range" min="2" max="8" step="1" value="'+(10-ovCols)+'">'+
      '<span class="zi">+</span>';
    bar.querySelector('input').addEventListener('input',e=>{
      const keep=overview.scrollTop/Math.max(1,ovgrid.scrollHeight);
      ovCols=10-parseInt(e.target.value);
      buildOv();
      overview.scrollTop=keep*ovgrid.scrollHeight;
    });
    overview.insertBefore(bar,ovgrid);
  }
  function buildOv(){
    ensureOvBar();
    const bi=document.querySelector('#ovbar input');
    if(bi)bi.value=10-ovCols;
    ovgrid.style.gridTemplateColumns='repeat('+ovCols+',1fr)';
    ovgrid.innerHTML='';
    const ts=((innerWidth-30*2-18*(ovCols-1))/ovCols)/1280;
    const canEdit=canEditDeck();
    const mk=(s,i)=>{
      const t=document.createElement('div');t.className='thumb';t.style.setProperty('--ts',ts);
      t.dataset.vstd=s.dataset.vstd||'';
      if(s.hasAttribute('data-hidden'))t.classList.add('hiddenSlide');
      if(s.hasAttribute('data-parked'))t.classList.add('parkedSlide');
      if(ovSel.has(s.dataset.vstd))t.classList.add('selected');
      const c=s.cloneNode(true);c.classList.add('active');c.classList.add('mini');c.style.display='block';
      t.appendChild(c);
      const cap=document.createElement('div');cap.className='cap';
      cap.textContent=(s.hasAttribute('data-parked')?'unused':dispNum(i))+' · '+(s.dataset.sec||'');
      t.appendChild(cap);
      if(canEdit&&s.dataset.vstd){
        const eye=document.createElement('button');eye.className='eye';
        eye.textContent=s.hasAttribute('data-hidden')?'unhide':'hide';
        eye.addEventListener('click',ev=>{
          ev.stopPropagation();
          if(s.hasAttribute('data-hidden'))s.removeAttribute('data-hidden');
          else s.setAttribute('data-hidden','1');
          persistSlide(s);buildOv();
        });
        t.appendChild(eye);
        t.draggable=true;
        t.addEventListener('dragstart',()=>{
          ovAutoStart();
          dragSrc=s.dataset.vstd;
          if(!ovSel.has(dragSrc)){ovSel.clear();}
          document.querySelectorAll('#ovgrid .thumb').forEach(x=>{
            if(x.dataset.vstd===dragSrc||ovSel.has(x.dataset.vstd))x.classList.add('dragging');
          });
        });
        t.addEventListener('dragend',()=>{ovAutoStop();document.querySelectorAll('#ovgrid .thumb.dragging').forEach(x=>x.classList.remove('dragging'));});
        t.addEventListener('dragover',ev=>{ev.preventDefault();t.classList.add('dragover');});
        t.addEventListener('dragleave',()=>t.classList.remove('dragover'));
        t.addEventListener('drop',ev=>{
          ev.preventDefault();t.classList.remove('dragover');
          if(s.hasAttribute('data-parked')){dropSel({type:'park'});return;}
          const rect=t.getBoundingClientRect();
          const front=(dispNum(i)===1&&ev.clientX<rect.left+rect.width/2);
          dropSel(front?{type:'front'}:{type:'after',id:s.dataset.vstd});
        });
      }
      t.addEventListener('click',ev=>{
        if(canEdit&&(ev.metaKey||ev.ctrlKey)&&s.dataset.vstd){
          if(ovSel.has(s.dataset.vstd))ovSel.delete(s.dataset.vstd);
          else ovSel.add(s.dataset.vstd);
          t.classList.toggle('selected');
          return;
        }
        ovSel.clear();
        overview.classList.remove('open');show(i);
      });
      return t;
    };
    slides.forEach((s,i)=>{if(!s.hasAttribute('data-parked'))ovgrid.appendChild(mk(s,i));});
    if(canEdit){
      const br=document.createElement('div');br.className='ovbreak';br.textContent='UNUSED SLIDES — drag here to park';
      br.addEventListener('dragover',ev=>{ev.preventDefault();br.classList.add('dragover');});
      br.addEventListener('dragleave',()=>br.classList.remove('dragover'));
      br.addEventListener('drop',ev=>{ev.preventDefault();br.classList.remove('dragover');dropSel({type:'park'});});
      ovgrid.appendChild(br);
      slides.forEach((s,i)=>{if(s.hasAttribute('data-parked'))ovgrid.appendChild(mk(s,i));});
    }
    if(window.__vprogApply)window.__vprogApply();
  }

  document.getElementById('hud').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.download){document.getElementById('downloadMenu').classList.remove('open');downloadDeck(b.dataset.download);return;}
    const a=b.dataset.act;
    if(a==='vessica'){document.dispatchEvent(new Event('vstd:vtoggle'));document.getElementById('hudmore').classList.remove('open');return;}
    if(a==='more'){document.getElementById('hudmore').classList.toggle('open');return;}
    document.getElementById('hudmore').classList.remove('open');
    if(a==='prev')step(-1);else if(a==='next')step(1); // step() skips parked+hidden — show(cur±1) walked straight through the parking lot on touch devices
    else if(a==='menu')menu.classList.toggle('open');
    else if(a==='grid'){buildOv();overview.classList.add('open');}
    else if(a==='sticky'){if(window.__stickyToggle)window.__stickyToggle();}
    else if(a==='companion'){if(window.__companionDrawer)window.__companionDrawer.toggle();}
    else if(a==='notes'){notesOn=!notesOn;notesPanel.classList.toggle('open',notesOn);}
    else if(a==='edit')toggleEdit();
    else if(a==='save')saveHtml();
    else if(a==='download'){document.getElementById('downloadMenu').classList.toggle('open');}
    else if(a==='share')openShare();
    else if(a==='present')enterPresent();
  });
  addEventListener('pointerdown',e=>{
    if(!e.target.closest('#downloadMenu,#downloadbtn'))document.getElementById('downloadMenu').classList.remove('open');
  },true);
  menu.addEventListener('click',e=>{if(e.target===menu)menu.classList.remove('open');});
  function keyTargetIsTextEntry(e){
    const selector='input,textarea,select,[contenteditable="true"],[contenteditable=""],[role="textbox"]';
    return [e&&e.target,document.activeElement].some(el=>el&&el.nodeType===1&&
      (el.isContentEditable||(el.matches&&el.matches(selector))||(el.closest&&el.closest(selector))));
  }
  addEventListener('keydown',e=>{
    if(keyTargetIsTextEntry(e))return;
    if(editingText){if(e.key==='Escape'){e.preventDefault();stopTextEdit();}return;}
    if(editMode&&(e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();doUndo();return;}
    if(editMode&&selEl&&(e.key==='Delete'||e.key==='Backspace')){
      e.preventDefault();pushUndo();
      const sec=slides[cur];
      selEl.remove();clearSel();
      undoPersist(sec);
      toast('Deleted \u2014 \u2318Z to undo');
      return;
    }
    if(editMode&&selEl&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();nudge(e);return;}
    if(editMode&&e.key===' ')return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();step(1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1);}
    else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);
    else if(e.key==='n'||e.key==='N'){notesOn=!notesOn;notesPanel.classList.toggle('open',notesOn);}
    else if(e.key==='s'||e.key==='S'){e.preventDefault();if(window.__stickyToggle)window.__stickyToggle();}
    else if(e.key==='m'||e.key==='M')menu.classList.toggle('open');
    else if(e.key==='g'||e.key==='G'){buildOv();overview.classList.toggle('open');if(window.__vprogApply)window.__vprogApply();}
    else if(e.key==='e'||e.key==='E')toggleEdit();
    else if(e.key==='p'||e.key==='P')enterPresent();
    else if(e.key==='v'||e.key==='V')document.dispatchEvent(new Event('vstd:vtoggle'));
    else if(e.key==='d'||e.key==='D')document.dispatchEvent(new Event('vstd:dtoggle'));
    else if(e.key==='Escape'){clearSel();overview.classList.remove('open');menu.classList.remove('open');closeShare();}
  });

  // ---------- Edit mode ----------
  let editMode=false,selEl=null,editingText=false,drag=null;
  const editRibbon=document.getElementById('editRibbon');
  const editTools=editRibbon.querySelector('.etools');
  const editSelection=document.getElementById('editSelection');
  const selbox=document.createElement('div');
  selbox.id='selbox';

          const chip=document.createElement('button');

/* ============ companion Markdown drawer ============ */
(function(){
  if(!(window.VSTD&&location.protocol.indexOf('http')===0))return;
  const drawer=document.getElementById('companionDrawer');
  const preview=drawer.querySelector('.preview'),ta=drawer.querySelector('textarea');
  const title=drawer.querySelector('.ctitle'),state=drawer.querySelector('.cstate'),attachList=drawer.querySelector('.attachlist');
  let slideId='',hash='',markdown='',dirty=false,loading=null;
  const editable=()=>!window.__vme||window.__vme.editable===true;
  const currentId=()=>{const s=document.querySelector('#frame > .slide.active');return s&&s.dataset.vstd;};
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function inline(s){
    return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function render(md){
    let front='';
    if(md.startsWith('---\n')){const e=md.indexOf('\n---',4);if(e>=0){front=md.slice(4,e);md=md.slice(e+4).replace(/^\r?\n/,'');}}
    const out=[];let list=false,code=false,codeLines=[];
    if(front)out.push('<details><summary>Metadata</summary><div class="frontmatter">'+esc(front)+'</div></details>');
    const closeList=()=>{if(list){out.push('</ul>');list=false;}};
    md.split(/\r?\n/).forEach(line=>{
      if(/^```/.test(line)){if(code){out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');codeLines=[];code=false;}else{closeList();code=true;}return;}
      if(code){codeLines.push(line);return;}
      const h=line.match(/^(#{1,3})\s+(.*)$/);if(h){closeList();out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');return;}
      const li=line.match(/^\s*[-*]\s+(.*)$/);if(li){if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(li[1])+'</li>');return;}
      closeList();if(!line.trim()){out.push('');return;}out.push('<p>'+inline(line)+'</p>');
    });
    closeList();if(code)out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');
    preview.innerHTML=out.join('\n');
  }
  function attachments(items){

  async function load(id){
    id=id||currentId();if(!id)return;
    state.textContent='Loading…';slideId=id;
    const r=await fetch('/api/deck/'+window.VSTD.deck+'/slide/'+id);
    if(!r.ok)throw new Error('load '+r.status);
    const j=await r.json();markdown=j.companion||'';hash=j.companion_hash||'';dirty=false;
    ta.value=markdown;render(markdown);attachments(j.attachments||[]);title.textContent=id+' · companion';state.textContent='Saved';
  }
  async function ensureLoaded(){const id=currentId();if(!id)throw new Error('no current slide');if(slideId!==id||!markdown){if(loading)await loading;else{loading=load(id).finally(()=>loading=null);await loading;}}}
  async function save(){
    if(!editable())throw new Error('read-only mode');await ensureLoaded();
    markdown=ta.value;state.textContent='Saving…';window.__selfSave=Date.now();
    const headers={'Content-Type':'text/markdown'};if(hash)headers['X-VSTD-Companion-Hash']=hash;
    const r=await fetch('/api/deck/'+window.VSTD.deck+'/slide/'+slideId+'/companion',{method:'PUT',headers,body:markdown});
    window.__selfSave=Date.now();
    if(r.status===409){state.textContent='Conflict — reload required';throw new Error('companion changed on disk; reload it before saving');}
    if(!r.ok)throw new Error('save '+r.status);
    const j=await r.json();hash=j.hash||hash;dirty=false;render(markdown);state.textContent='Saved live';
    if(window.__vreportHostedSync)window.__vreportHostedSync();
    return 'companion saved';
  }
  async function open(edit){drawer.classList.add('open');await ensureLoaded();setMode(!!edit);return 'companion opened';}
  function close(){drawer.classList.remove('open');}
  function sectionBounds(md,name){
    const re=new RegExp('^## '+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*$','m');const m=re.exec(md);if(!m)return null;
    const start=m.index+m[0].length;const rest=md.slice(start);const n=/\n##\s+/.exec(rest);return {start,end:n?start+n.index:md.length};
  }
  async function editCompanion(op,args){
    await open(true);let next=ta.value;
    if(op==='edit_companion'){
      const find=args.find||'';if(!find)throw new Error('find text is required');const i=next.toLowerCase().indexOf(find.toLowerCase());if(i<0)throw new Error('text not found in companion');next=next.slice(0,i)+(args.replace||'')+next.slice(i+find.length);
    }else{
      const name=args.section||'Talk track',b=sectionBounds(next,name),text=(args.text||'').trim();
      if(b){const before=next.slice(0,b.start),after=next.slice(b.end);const old=next.slice(b.start,b.end).trim();const body=op==='append_companion_section'?(old?old+'\n\n'+text:text):text;next=before+'\n'+body+'\n'+after.replace(/^\n*/,'\n');}
      else next=stringsTrim(next)+'\n\n## '+name+'\n'+text+'\n';
    }
    ta.value=next;markdown=next;dirty=true;render(next);state.textContent='Vessica editing…';await save();return 'companion updated and visible in the drawer';
  }
  function stringsTrim(s){return (s||'').replace(/\s+$/,'');}
  ta.addEventListener('input',()=>{dirty=true;markdown=ta.value;render(markdown);state.textContent='Unsaved changes';});
  ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save().catch(x=>window.VSTDP&&window.VSTDP.toast(x.message));}});
  drawer.querySelector('.previewtab').addEventListener('click',()=>{render(ta.value);setMode(false);});
  drawer.querySelector('.edittab').addEventListener('click',()=>setMode(true));
  drawer.querySelector('.save').addEventListener('click',()=>save().catch(e=>window.VSTDP&&window.VSTDP.toast('Companion save failed: '+e.message)));
  drawer.querySelector('.cclose').addEventListener('click',close);
  drawer.querySelector('input[type=file]').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    try{await ensureLoaded();state.textContent='Attaching '+f.name+'…';const r=await fetch('/api/deck/'+window.VSTD.deck+'/slide/'+slideId+'/attachment?filename='+encodeURIComponent(f.name),{method:'POST',body:f});if(!r.ok)throw new Error(await r.text());await load(slideId);window.VSTDP&&window.VSTDP.toast('Source attached to companion');}catch(x){window.VSTDP&&window.VSTDP.toast('Attach failed: '+x.message);}finally{e.target.value='';}
  });
  document.addEventListener('vstd:slide',()=>{if(!drawer.classList.contains('open'))return;if(dirty){save().then(()=>load(currentId())).catch(e=>window.VSTDP&&window.VSTDP.toast(e.message));}else load(currentId()).catch(()=>{});});
  window.__companionDrawer={toggle:()=>drawer.classList.contains('open')?close():open(false),open:()=>open(true),save,run:(name,args)=>name==='open_companion'?open(true):editCompanion(name,args||{})};
})();

/* ============ background-work progress (image gen + redesign queue) ============ */
(function(){
  if(!(window.VSTD&&location.protocol.indexOf('http')===0))return;
  let bar,label,st={pending:{}};
  let capbar;
  function ui(){
    if(bar)return;
    bar=document.createElement('div');bar.id='vprog';bar.innerHTML='<div class="fill"></div>';document.body.appendChild(bar);
    label=document.createElement('div');label.id='vproglabel';document.body.appendChild(label);
    capbar=document.createElement('div');capbar.id='capbar';
    capbar.innerHTML='<span></span><button></button>';
    capbar.querySelector('button').addEventListener('click',async ()=>{
      const a=(st.agent||{}),next=Math.min(100,(a.maxPerHour||12)*2);
      try{
        const r=await fetch('/api/agent/cap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({maxPerHour:next})});
        if(!r.ok)throw new Error(await r.text());
        const j=await r.json();
        if(window.VSTDP)window.VSTDP.toast('Agent cap raised to '+j.maxPerHour+'/hour — resets to default on restart');
        capbar.style.display='none';
        setTimeout(poll,400);
      }catch(e){if(window.VSTDP)window.VSTDP.toast('Cap raise failed: '+e.message);}
    });
    document.body.appendChild(capbar);
  }
  function applyCap(){
    if(!capbar)return;
    const a=st.agent;
    const canEdit=!window.__vme||window.__vme.editable===true;
    if(a&&a.capped&&a.queued>0&&canEdit&&!window.__presenting){
      capbar.querySelector('span').textContent='Agent rate cap reached ('+a.used+'/'+a.maxPerHour+' per hr) — '+a.queued+' slide'+(a.queued>1?'s':'')+' waiting';
      capbar.querySelector('button').textContent='Raise to '+Math.min(100,a.maxPerHour*2)+'/hr';
      capbar.style.display='flex';
    }else capbar.style.display='none';
  }
  function summarize(list){
    let pct=0,kinds={};
    (list||[]).forEach(e=>{const k=e.kind||e,p=e.pct||15;kinds[k]=1;if(p>pct)pct=p;});
    if(kinds.error)return {pct:15,txt:'redesign needs attention — see slide companion'};
    if(kinds.redesign&&(!st.agent||st.agent.enabled!==true))return {pct:0,txt:'redesign waiting — cloud agent is disabled'};
    const what=kinds.image&&kinds.redesign?'imagery + redesign':(kinds.image?'generating imagery':'redesign');
    return {pct,txt:what+(kinds.image&&!kinds.redesign?'':' pass')+(pct>15?' in progress':' queued')+' — ~'+pct+'%'};
  }
  function cur(){const a=document.querySelector('#frame > .slide.active');return a&&a.dataset.vstd;}
  function apply(){
    ui();
    const ovOpen=document.getElementById('overview').classList.contains('open');

      const sm=summarize(p);

      label.textContent=sm.txt+' · this slide';
    }else{bar.style.display='none';label.style.display='none';}
    document.querySelectorAll('#ovgrid .thumb').forEach(t=>{
      const list=(st.pending||{})[t.dataset.vstd]||[];

        if(!b){b=document.createElement('div');b.className='tprog';b.innerHTML='<div class="fill"></div>';t.appendChild(b);}
        b.querySelector('.fill').style.width=summarize(list).pct+'%';
      }else if(b)b.remove();
    });
  }
  async function poll(){
    try{const r=await fetch('/api/deck/'+window.VSTD.deck+'/status');
      if(!r.ok)return;st=await r.json();apply();applyCap();}catch(_){}
  }
  document.addEventListener('vstd:slide',apply);
  setInterval(poll,5000);setTimeout(poll,800);
  window.__vprogApply=apply;
  window.__vpendingState=()=>st;
})();

    try{
      const r=await fetch('/api/deck/'+deck+'/slide/'+id);
      const j=await r.json();
      const m=(j.companion||'').match(/## Edit requests\n([\s\S]*?)(?=\n## |$)/);
      const prev=((m&&m[1])||'').split('\n').filter(l=>l.trim()&&!l.startsWith('(resolved')).join('\n');
      const tag=refDesc?' — re: '+refDesc:'';
      const body=(prev?prev+'\n':'')+'- '+new Date().toISOString().slice(0,10)+' (sticky note'+tag+'): '+text;
      window.__selfSave=Date.now();
      const pr=await fetch('/api/deck/'+deck+'/slide/'+id+'/companion/'+encodeURIComponent('Edit requests'),{method:'PUT',body:body});
      window.__selfSave=Date.now();
      if(!pr.ok)throw new Error('save '+pr.status);
      ta.value='';clearRef();
      P().toast('Note queued — agent will pick it up');
      if(window.__vreportHostedSync)window.__vreportHostedSync();
      loadOpen();refreshBadge();
      if(window.__vprogApply)setTimeout(window.__vprogApply,300);
      close();
    }catch(err){P().toast('Note failed: '+err.message);}
  }
  window.__stickyToggle=()=>{ui();toggle();};
  setTimeout(ui,600);
})();

/* ================= Vessica realtime layer (Phase 3 spike) =================
   Wake word: "Vessica". Always-listening once started (V key / status pill).
   The model can ONLY act through tools while muted; audio is unmuted
   client-side exclusively by a begin_conversation tool call — that mute is
   the guarantee, not the prompt. */
(function(){
  const S={pc:null,dc:null,audio:null,mic:null,on:false,talking:false};
  const status=document.getElementById('vstatus');
  const label=document.getElementById('vlabel');
  const P=()=>window.VSTDP;

  function setState(cls,text){
    status.className='';
    if(cls)status.classList.add(cls);
    status.style.display='flex';
    label.textContent=text;
  }
  function hideState(){status.style.display='none';}

  document.addEventListener('vstd:vtoggle',()=>{S.on?stop('Vessica off'):start();});
  status.addEventListener('click',()=>{S.on?stop('Vessica off'):start();});

  function fetchT(url,opts,ms,label){
    const ctl=new AbortController();
    const t=setTimeout(()=>ctl.abort(),ms);
    return fetch(url,Object.assign({},opts,{signal:ctl.signal}))
      .catch(e=>{throw new Error(label+(e.name==='AbortError'?' timed out after '+(ms/1000)+'s — network may be blocking or very slow':' failed: '+e.message));})
      .finally(()=>clearTimeout(t));
  }
  async function start(){
    if(S.on)return;
    if(!(window.VSTD&&location.protocol.indexOf('http')===0)){
      P().toast('Vessica needs the engine — run vstd serve and open the deck from localhost');
      return;
    }
    const stage=t=>{setState('connecting','Vessica: '+t);console.log('vessica stage:',t);};
    try{
      stage('minting token…');
      const tr=await fetchT('/api/realtime/token',{method:'POST'},20000,'token mint (engine → OpenAI)');
      if(!tr.ok)throw new Error('token '+tr.status+' — is OPENAI_API_KEY configured?');
      const tj=await tr.json();
      const secret=(tj.client_secret&&tj.client_secret.value)||tj.value||tj.client_secret;
      if(!secret||typeof secret!=='string')throw new Error('no client secret in token response: '+JSON.stringify(tj).slice(0,120));

      stage('requesting microphone…');
      S.mic=await navigator.mediaDevices.getUserMedia({audio:true});
      S.pc=new RTCPeerConnection();
      S.audio=new Audio();S.audio.autoplay=true;S.audio.muted=true; // THE mute guarantee
      S.pc.ontrack=e=>{S.audio.srcObject=e.streams[0];};
      S.mic.getTracks().forEach(t=>S.pc.addTrack(t,S.mic));
      S.dc=S.pc.createDataChannel('oai-events');
      S.dc.onmessage=onEvent;
      S.dc.onclose=()=>{
        if(S.on&&!S.intentional){
          // unexpected drop (session timeout, network blip, post-call hiccup):
          // restart transparently instead of dying silently
          S.retries=(S.retries||0)+1;
          if(S.retries<=2){
            setState('connecting','Vessica reconnecting…');
            cleanup();S.on=false;
            setTimeout(start,900);
          }else{
            setState('error','Vessica lost the connection — press V to restart');
            cleanup();S.on=false;
          }
        }
      };
      S.dc.onopen=()=>{clearTimeout(S.watchdog);S.retries=0;S.intentional=false;configure();setState('listening','Vessica listening · rehearsal · say "Vessica" to talk');};
      S.pc.oniceconnectionstatechange=()=>{
        const st=S.pc?S.pc.iceConnectionState:'?';
        console.log('vessica ice:',st);
        if(st==='checking')stage('establishing audio path (ICE)… — if this never completes, the network is blocking WebRTC/UDP');
        if(st==='failed'){setState('error','Vessica: audio path FAILED — this network blocks WebRTC (UDP). Signaling worked; the code is fine. Try another network.');S.intentional=true;cleanup();}
        if((st==='connected'||st==='completed')&&S.pc)console.log('vessica ice connected');
      };

      stage('negotiating session…');
      const offer=await S.pc.createOffer();
      await S.pc.setLocalDescription(offer);
      const rt=(window.VSTD.realtime)||{};
      const base=(rt.base||'https://api.openai.com/v1');
      const model=(rt.model||'gpt-realtime-2');
      const sr=await fetchT(base+'/realtime/calls?model='+encodeURIComponent(model),{
        method:'POST',headers:{'Authorization':'Bearer '+secret,'Content-Type':'application/sdp'},
        body:offer.sdp},25000,'SDP negotiation (browser → OpenAI)');
      if(!sr.ok)throw new Error('webrtc offer rejected: HTTP '+sr.status+' '+(await sr.text()).slice(0,160));
      const answerSdp=await sr.text();
      await S.pc.setRemoteDescription({type:'answer',sdp:answerSdp});
      S.on=true;
      stage('establishing audio path (ICE)…');
      S.watchdog=setTimeout(()=>{
        if(S.dc&&S.dc.readyState!=='open'){
          S.intentional=true;
          const ice=S.pc?S.pc.iceConnectionState:'?';
          setState('error','Vessica: stalled establishing the audio path (ICE state: '+ice+'). This network almost certainly blocks WebRTC/UDP — common on airplane and hotel wifi. Try another network.');
          cleanup();S.on=false;
        }
      },30000);
    }catch(err){
      setState('error','Vessica failed: '+err.message);
      S.intentional=true;cleanup();
      setTimeout(hideState,8000);
    }
  }

  function stop(msg){
    S.intentional=true;
    if(window.__vdict)try{window.__vdict.flush();}catch(_){}
    window.__dictating=false;
    cleanup();
    S.on=false;S.talking=false;
    setState('','');hideState();
    if(msg)P().toast(msg);
  }
  function cleanup(){
    try{S.dc&&S.dc.close();}catch(_){}
    try{S.pc&&S.pc.close();}catch(_){}
    try{S.mic&&S.mic.getTracks().forEach(t=>t.stop());}catch(_){}
    S.pc=S.dc=S.mic=null;
    clearGlow();
  }

  const TOOLS=[

    {type:'function',name:'open_companion',description:'IN CONVERSATION ONLY: open the current slide companion Markdown in its side drawer for narrative editing. Use when the speaker says they want to view or edit the companion, narrative, intent, evidence, talk track, visual direction, or notes.',parameters:{type:'object',properties:{}}},
    {type:'function',name:'edit_companion',description:'IN CONVERSATION ONLY: replace exact existing prose in the current slide companion Markdown while keeping the drawer open so dictated edits appear live.',parameters:{type:'object',properties:{find:{type:'string'},replace:{type:'string'}},required:['find','replace']}},
    {type:'function',name:'set_companion_section',description:'IN CONVERSATION ONLY: replace one companion Markdown section in full. section is the heading text without ##, such as Intent, Key ideas, Evidence & sources, Talk track, or Visual direction.',parameters:{type:'object',properties:{section:{type:'string'},text:{type:'string'}},required:['section','text']}},

    {type:'function',name:'new_blank_slide',description:'IN CONVERSATION ONLY: create a fresh draft slide after the current one ("give me a blank slide [titled X]"). Then AUTHORING MODE begins: treat subsequent speech as content — distill points with author_point, capture narration with author_talk — until the speaker says done/back to the presentation.',parameters:{type:'object',properties:{title:{type:'string'}}}},

  function highlightables(){
    const seen=new Set(),out=[];
    P().slideEl().querySelectorAll('.bh,.s-title,.s-lead,li,.chev,.kpi,.headband,.card .tiny,b').forEach(el=>{
      const t=(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80);
      if(t.length>3&&!seen.has(t)){seen.add(t);out.push(t);}
    });
    return out.slice(0,24).map(t=>'"'+t+'"').join(' | ');
  }
  function deckMap(){
    let n=0;
    return [...document.querySelectorAll('#frame > .slide')].filter(el=>!el.hasAttribute('data-parked')).map(el=>{
      n++;
      const t=((el.querySelector('.s-title,.serif')||{}).textContent||el.dataset.menu||el.dataset.sec||'').trim().replace(/\s+/g,' ').slice(0,70);
      return n+': '+t+(el.hasAttribute('data-hidden')?' (hidden — goto_slide will unhide it; next_slide skips it)':'');
    }).join('\n');
  }
  function baseInstructions(){
    const el=P().slideEl();

    const notes=(el.querySelector('.notes')||{}).textContent||'';
    const next=document.querySelectorAll('#frame > .slide')[P().cur()+1];
    const nextTitle=next?((next.querySelector('.s-title,.serif')||{}).textContent||''):'(end of deck)';
    const nextCue=next?((next.querySelector('.notes')||{}).textContent||'').slice(0,300):'';
    return `You are Vessica, a silent presentation co-pilot for the deck "${window.VSTD.title}". REHEARSAL MODE.
RULES:
- Stay COMPLETELY SILENT unless the speaker says the wake word "Vessica" — then call begin_conversation and respond briefly and helpfully, drawing on the slide context. When told to stop / be quiet / thanked, call end_conversation and go silent again.
- While silent, your ONLY actions are tool calls. Never produce audio without begin_conversation.
- Advance slides with next_slide when the speaker finishes the current slide's material and begins the next slide's opening idea. Be conservative — never advance mid-thought. Obey explicit commands ("next slide", "go back", "go to slide 12") immediately via tools.
- Use highlight(phrase) when the speaker dwells on a specific element visible on the slide; clear_highlight when they move on.
- LIVE EDITING (only after the wake word, in conversation): the speaker may ask you to change the slide — "change X to Y" → edit_text; "retitle this…" → set_slide_title; "add a bullet…" → add_bullet; "remove …" → remove_element. Confirm briefly aloud. For big asks (redesign, new image, restructure) use note_edit_request and say it's queued for the redesign pass.
- COMPANION NARRATIVE EDITING: "open/edit the companion/narrative/talk track" → open_companion. While the speaker dictates narrative changes, use edit_companion for exact replacements, set_companion_section for a complete rewrite, or append_companion_section for additional prose. Each call saves immediately and visibly updates the drawer. Source attachments shown above the Markdown are part of the companion contract and may be referenced in edit requests.
- BLANK-SLIDE AUTHORING (in conversation): "give me a blank slide (titled X)" → new_blank_slide. Then the speaker talks the slide into existence: distill each distinct point with author_point, stream narration with author_talk, set the lead with author_lead. When they say they're done / back to the presentation, call done_authoring and fall silent again on end_conversation if asked.
NAVIGATION: "go to slide 12" -> goto_slide(12). "go to the slide about X" -> find the best match in the DECK MAP below and goto_slide its number. Use next_slide ONLY for natural forward progression, never for jump requests.
DECK MAP:
${deckMap()}
HIGHLIGHTABLE ELEMENTS ON THIS SLIDE (for highlight(phrase) — copy one VERBATIM): ${highlightables()}
CURRENT SLIDE ${P().cur()+1}/${P().count}: "${title.trim()}"
SPEAKER'S TALK TRACK FOR THIS SLIDE: ${notes.trim().slice(0,600)}
NEXT SLIDE: "${nextTitle.trim()}" — its talk track begins: ${nextCue}
PROJECT MODE (in conversation): the speaker may hand you a real project ("get input from the audience", "make us a visualization"). Your PROJECT TOOLS act in the REAL world — send_sms and send_email reach the actual people in the KNOWLEDGE BASE below. When handed a project: state your plan aloud in one or two sentences, create it with tasks_create (the audience watches it on the demo slide), then execute step by step — checking off tasks with tasks_check as you complete them and keeping the Live Display current with display_render. Individual SMS replies and [CALL REPORT]s arrive as their own events; weave those in. Audience-chat input arrives BATCHED as [AUDIENCE PULSE] events (totals + recent messages) — treat pulses as a stream of aggregate data: keep a running synthesis on the Live Display (themes, counts, a chart when it stabilizes) and comment aloud only on the AGGREGATE picture, briefly, at natural pauses. Never read out or reply to individual chat messages one by one, and never interrupt the presenter mid-thought for a pulse. For BROAD audience input, prefer the scan-to-chat channel: audience_ask(what you want to learn) then show_chat_qr — each scanner gets a one-on-one chat with you and their answers stream back as [INCOMING REPLY] events (use this over SMS when texting is unavailable). Text individuals for quick pulses; use call_person when a real conversation would be richer (it dials, converses, and reports back as a [CALL REPORT] while you keep working); email those with only an email address. If a tool reports "not configured", say so plainly and continue with what works.
KNOWLEDGE BASE (this presentation's company + audience notes, may include contact details — use kb_read for full documents):
${(window.__vtools&&window.__vtools.digest())||'(no knowledge-base documents uploaded for this deck)'}`;
  }

  function send(o){if(S.dc&&S.dc.readyState==='open')S.dc.send(JSON.stringify(o));}

  }

  function onEvent(e){
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(!/delta|buffer|transcript|\.added|\.created|rate_limits/.test(m.type))console.log('vessica evt:',m.type,m.name||'',(m.response&&m.response.status)||'');
    if(m.type==='response.done'&&m.response&&m.response.status==='failed')console.warn('vessica response FAILED:',JSON.stringify(m.response.status_details||m.response).slice(0,400));
    if(m.type==='session.updated')console.log('vessica session updated ok — tools registered:',(m.session&&m.session.tools&&m.session.tools.length)||0);
    if(m.type==='response.created')respActive=true;
    if(m.type==='response.done')respDone();
    if(m.type==='response.function_call_arguments.done'){
      let args={};try{args=JSON.parse(m.arguments||'{}');}catch(_){}
      runTool(m.name,args,m.call_id);
    }
    if(m.type==='output_audio_buffer.started'&&S.talking)setState('speaking','Vessica speaking — say "that\'s all" to end');
    if(m.type==='output_audio_buffer.stopped'&&S.on&&S.talking)setState('listening','Vessica in conversation · listening');
    if(m.type==='error')console.warn('vessica ERROR:',JSON.stringify(m.error||m).slice(0,500));

  // ---- presenter-mode editing helpers ----
  function editable(){return !window.__vme||window.__vme.editable===true;}
  function activeSec(){return document.querySelector('#frame > .slide.active');}
  async function persistActive(){
    const sec=activeSec();if(!sec)return 'no active slide';
    if(!sec.dataset.vstd)return 'slide has no id';
    try{
      if(!window.__vsaveSlide)return 'save unavailable';
      const res=await window.__vsaveSlide(sec);
      if(res.status==='conflict')return 'NOT saved: the slide changed on disk after this page loaded — the speaker should reload the deck before more edits';
      return res.status==='ok'?'saved':'save failed';
    }catch(e){return 'save failed: '+e.message;}
  }
  function findTextEl(phrase){
    const p=(phrase||'').toLowerCase();
    const cands=activeSec().querySelectorAll('.s-title,.s-lead,.bh,li,.chev,.kpi,.headband,.card,td,b,div,span');
    let best=null,bestLen=Infinity;
    cands.forEach(el=>{
      const t=(el.textContent||'').toLowerCase();
      if(t.includes(p)&&t.length<bestLen&&el.children.length<6){best=el;bestLen=t.length;}
    });
    return best;
  }
  function editText(find,replace){
    if(!editable())return 'read-only mode — edits need local studio serving';
    const el=findTextEl(find);
    if(!el)return 'could not find "'+find+'" on this slide';
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    let n,done=false;
    while((n=walker.nextNode())){
      const i=n.nodeValue.toLowerCase().indexOf(find.toLowerCase());
      if(i>=0){n.nodeValue=n.nodeValue.slice(0,i)+replace+n.nodeValue.slice(i+find.length);done=true;break;}
    }
    if(!done)el.textContent=replace;
    persistActive();P().toast('Edited: '+replace.slice(0,40));
    return 'changed';
  }
  function addBullet(text){
    if(!editable())return 'read-only mode';
    const d=window.__vdict&&window.__vdict.state().draft;
    const sec=activeSec();
    if(d&&sec&&sec.dataset.vstd===d.id)return JSON.stringify(window.__vdict.run('add_point',{text:text}));
    let ul=sec.querySelector('ul.cl');
    if(!ul){
      const content=sec.querySelector('.content')||sec;
      ul=document.createElement('ul');ul.className='cl';ul.style.fontSize='24px';
      content.appendChild(ul);

  async function noteEdit(instruction){

      const cur=await (await fetch('/api/deck/'+window.VSTD.deck+'/slide/'+id)).json();

      const body=(prev?prev+'\n':'')+'- '+new Date().toISOString().slice(0,10)+' (spoken during presentation): '+instruction;

  /* single-flight response scheduler: the realtime API rejects
     response.create while another response is active — with async tools,
     inbound pushes and VAD all racing, collisions wedge the session. Every
     response request goes through here instead. */
  let respActive=false,respWanted=false;
  function requestResponse(){
    if(respActive){respWanted=true;return;}
    respActive=true;
    send({type:'response.create'});
  }
  function respDone(){
    respActive=false;
    if(respWanted){respWanted=false;setTimeout(requestResponse,300);}
  }
    const VTOOLS={audience_ask:1,call_person:1,send_sms:1,send_email:1,web_search:1,run_code:1,kb_read:1,tasks_create:1,tasks_add:1,tasks_check:1,tasks_list:1,check_inbox:1,display_render:1,display_append:1,display_clear:1};
  const CTOOLS={open_companion:1,edit_companion:1,set_companion_section:1,append_companion_section:1};
  async function vesTool(name,args){
    const base='/api/vessica/'+window.VSTD.deck;
    const post=async(pth,body)=>{
      const r=await fetch(base+pth,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

      case 'web_search':return (await post('/search',{query:args.query})).result||'(no result)';
      case 'run_code':{const j=await post('/code',{task:args.task});return (j.result||'(no output)')+((j.artifacts&&j.artifacts.length)?'\nARTIFACT URLS (use in <img src=...> on the display): '+j.artifacts.join(' '):'');}
      case 'kb_read':return (await get('/kb/'+encodeURIComponent(args.name))).content||'(empty)';
      case 'tasks_create':return 'task list created:\n'+JSON.stringify(await post('/tasks',{op:'create',project:args.project,items:args.items||[]}));

      case 'display_render':await post('/display',{op:'render',html:args.html});return 'rendered to the Live Display';
      case 'display_append':await post('/display',{op:'append',html:args.html});return 'appended to the Live Display';
      case 'display_clear':await post('/display',{op:'clear'});return 'display cleared';

  function runTool(name,args,callId){

          (!window.__presenting?'<button id="vchatqrtest" style="margin-top:14px;padding:9px 16px;border:1px solid #21BF61;border-radius:10px;background:none;color:#0C2B15;font-family:\'Trebuchet MS\',sans-serif;font-size:14px;cursor:pointer">&#9889; Test: simulate 20 audience chatters</button>':'')+

    else if(name==='hide_chat_qr'){const q=document.getElementById('vchatqr');if(q)q.remove();out='chat QR hidden';}
    else if(name==='begin_conversation'){S.talking=true;S.audio.muted=false;setState('speaking','Vessica speaking');}
    else if(name==='end_conversation'){S.talking=false;S.audio.muted=true;setState('listening','Vessica listening · say "Vessica" to talk');}

    else if(name==='set_slide_title')out=editText((activeSec().querySelector('.s-title,.serif')||{textContent:''}).textContent.trim(),args.text);
    else if(name==='add_bullet')out=addBullet(args.text);

      else out='dictation module unavailable';

    else if(name==='author_point')out=JSON.stringify(window.__vdict?window.__vdict.run('add_point',{text:args.text}):'unavailable');

  let glowEl=null;
  function clearGlow(){if(glowEl){glowEl.classList.remove('vglow');glowEl=null;}}
  window.__vstopVessica=()=>{if(S.on)stop();};
  window.__vlive=()=>!!S.on;
  window.__vpres={run:(n,a)=>runTool(n,a||{},'test')};
  window.__vreconf=()=>{if(S.on)configure();};
  window.__vpush=(text)=>{
    if(!(S.on&&S.dc&&S.dc.readyState==='open'))return false;
    send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:text}]}});
    requestResponse();
    return true;
  };
  function normTxt(x){return (x||'').toLowerCase().replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/[\u2014\u2013]/g,'-').replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();}
  function doHighlight(phrase){
    clearGlow();
    if(!phrase)return false;
    const p=normTxt(phrase);
    const cands=P().slideEl().querySelectorAll('.bh,.s-title,.s-lead,li,.chev,.kpi,.headband,.card,.pill,td,b');
    let best=null,bestLen=Infinity;
    cands.forEach(el=>{
      const t=normTxt(el.textContent);
      if(t.includes(p)&&t.length<bestLen){best=el;bestLen=t.length;}
    });
    if(!best){ // fuzzy: stem-prefix overlap so "delegation"/"delegations" etc. still match
      const stems=p.split(' ').filter(w=>w.length>3).map(w=>w.slice(0,5));
      let bestScore=0;
      cands.forEach(el=>{
        const tw=normTxt(el.textContent).split(' ').map(w=>w.slice(0,5));
        const score=stems.filter(st=>tw.indexOf(st)>=0).length;
        const t=normTxt(el.textContent);
        if(score>bestScore||(score===bestScore&&score>0&&t.length<bestLen)){best=el;bestScore=score;bestLen=t.length;}
      });
      if(bestScore<Math.max(1,Math.ceil(stems.length/2)))best=null;
    }
    if(best){
      // climb from inline text to its containing box so the glow is a clean rectangle
      let box=best;
      while(box&&box.parentElement&&getComputedStyle(box).display==='inline')box=box.parentElement;
      glowEl=box;box.classList.add('vglow');return true;
    }
    return false;
  }
})();

    for(let i=0;i<10&&z>0.55;i++){

      }).catch(()=>{});

   the companion talk track and distilled bullets; spoken directives ("new
   slide titled…", "change the title to…") execute through the structured
   edit API. The dictating page updates its own DOM optimistically and
   suppresses live-reload; a final reload on finish syncs the canon. */
(function(){
  const D={on:false,pc:null,dc:null,mic:null,draft:null,dirty:false,timer:null,seq:0};
  let bar,dlabel,dtrans,dact;
  const P=()=>window.VSTDP;

  function ui(){
    if(bar)return;
    bar=document.createElement('div');bar.id='dictbar';
    bar.innerHTML='<span class="dot"></span><span class="dlabel">DICTATING</span>'+
      '<span class="dtrans" id="dtrans">say a slide title, or just start talking…</span>'+
      '<span class="dact" id="dact"></span><button id="dend">End dictation (D)</button>';
    document.body.appendChild(bar);
    dtrans=document.getElementById('dtrans');dact=document.getElementById('dact');
    document.getElementById('dend').addEventListener('click',()=>toggle());
  }
  function act(msg){if(!dact)return;dact.textContent=msg;clearTimeout(D._a);D._a=setTimeout(()=>{if(dact)dact.textContent='';},4000);}
  function trans(msg){if(dtrans)dtrans.textContent=msg;}

  document.addEventListener('vstd:dtoggle',()=>toggle());
  async function toggle(){D.on?end():startD();}

  async function startD(){
    if(D.on)return;
    if(!(window.VSTD&&location.protocol.indexOf('http')===0)){P().toast('Dictation needs the engine (vstd serve, studio mode)');return;}
