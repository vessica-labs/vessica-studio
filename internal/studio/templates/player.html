  addEventListener('paste',e=>{
    if(!canUpload())return;
    const item=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.kind==='file'&&/^image\//.test(i.type));
    if(!item)return;
    const blob=item.getAsFile();if(!blob)return;
    e.preventDefault();e.stopPropagation();
    const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
    const file=new File([blob],'pasted-image-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext,{type:blob.type});
    if(file.size>100*1024*1024){P().toast('Pasted image is too large (100MB max)');return;}
    uploadImage(file);
  },true);

  function uploadVideo(f){
    const mb=(f.size/1e6).toFixed(1);
    P().toast('Uploading '+f.name+' ('+mb+' MB)… 0%',60000);
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/asset/video?filename='+encodeURIComponent(f.name));
    xhr.upload.onprogress=ev=>{
      if(ev.lengthComputable)P().toast('Uploading '+f.name+' ('+mb+' MB)… '+Math.round(ev.loaded/ev.total*100)+'%',60000);
    };
    xhr.onload=()=>{
      window.__selfSave=Date.now();
      let j={};try{j=JSON.parse(xhr.responseText);}catch(_){}
      if(xhr.status!==200||!j.asset){P().toast('Upload failed: '+(j.error||('HTTP '+xhr.status)));return;}
      insertVideo(j.asset);
      const w=(j.warnings||[]).join('; ');
      P().toast('Video "'+j.asset.id+'" added'+(j.transcoded?' (transcoded for web)':'')+(w?' — '+w:''),6000);
    };
    xhr.onerror=()=>P().toast('Upload failed — network error');
    xhr.send(f);
  }
  function uploadImage(f){
    P().toast('Uploading '+f.name+'…',30000);
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/asset/image?filename='+encodeURIComponent(f.name));
    xhr.onload=()=>{
      window.__selfSave=Date.now();
      let j={};try{j=JSON.parse(xhr.responseText);}catch(_){}
      if(xhr.status!==200||!j.asset){P().toast('Upload failed: '+(j.error||('HTTP '+xhr.status)));return;}
      insertImage(j.asset);
      P().toast(j.reused?('Reused existing image "'+j.asset.id+'"'):('Image "'+j.asset.id+'" added to the library'),5000);
    };
    xhr.onerror=()=>P().toast('Upload failed — network error');
    xhr.send(f);
  }
  function insertImage(asset){
    const s=activeSlide();if(!s)return;
    const img=document.createElement('img');
    img.src='/library/'+asset.file;
    img.alt=asset.id;
    img.style.maxWidth='58%';img.style.maxHeight='58%';img.style.borderRadius='12px';
    const host=s.querySelector('.content')||s;
    if(host===s){img.style.position='absolute';img.style.right='66px';img.style.bottom='60px';}
    host.appendChild(img);
    persistSec(s);
    P().toast('Drag to place, handles to resize');
  }
  function insertVideo(asset){
    const s=activeSlide();if(!s)return;
    const v=document.createElement('video');
    v.className='vid';
    v.setAttribute('data-vstd-video',asset.id);
    v.setAttribute('data-autoplay','');
    v.setAttribute('data-loop','');
    const host=s.querySelector('.content')||s;
    if(host===s)v.setAttribute('style','position:absolute;left:66px;right:66px;top:168px;bottom:46px;width:auto;height:auto');
    host.appendChild(v);
    setup(v);ensureSrc(v,true);
    persistSec(s);
    showInspector(v);
  }

  // ---- edit mode: inspector for a selected video ----
  let insp=null,inspFor=null;
  function buildInspector(){
    if(insp)return;
    insp=document.getElementById('videoRibbonTools');
    insp.innerHTML='<button data-k="data-autoplay">Autoplay</button>'+
      '<button data-k="data-loop">Loop</button>'+
      '<button data-k="data-unmuted">Sound</button>'+
      '<button data-k="data-keep-time">Resume (don’t restart)</button>';
    insp.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||!inspFor)return;
      const k=b.dataset.k;
      const sec=inspFor.closest('.slide');
      if(inspFor.hasAttribute(k))inspFor.removeAttribute(k);else inspFor.setAttribute(k,'');
      setup(inspFor);syncInspector();persistSec(sec);
      if(k==='data-autoplay'||k==='data-unmuted')activate();
    });
  }
  function syncInspector(){
    if(!insp||!inspFor)return;
    insp.querySelectorAll('button[data-k^="data-"]').forEach(b=>b.classList.toggle('on',inspFor.hasAttribute(b.dataset.k)));
  }
  function showInspector(v){buildInspector();inspFor=v;insp.style.display='flex';syncInspector();}
  function hideInspector(){if(insp)insp.style.display='none';inspFor=null;}
  document.addEventListener('vstd:selection',e=>{
    const v=e.detail&&e.detail.element;
    if(document.body.classList.contains('editmode')&&v&&v.matches('video[data-vstd-video]'))showInspector(v);
    else hideInspector();
  });
  document.addEventListener('vstd:slide',hideInspector);

  activate(); // initial slide is already active by the time this layer loads
})();

/* ============ mobile-friendly HUD ============ */
(function(){
  const coarse=matchMedia('(pointer:coarse)').matches;
  const small=Math.min(innerWidth,innerHeight)<820&&innerWidth<900;
  if(!(coarse&&small))return; // desktops and large tablets keep the full bar
  document.body.classList.add('mobilehud');
  const hud=document.getElementById('hud'),more=document.getElementById('hudmore');
  if(!hud||!more)return;
  document.getElementById('hudMore').style.display='';
  // primary bar keeps: Prev · count · Next · Vessica · ⋯ — everything else
  // moves into the ⋯ popover (same delegated handlers keep working because
  // the popover lives inside #hud)
  const keep=new Set(['prev','next','vessica','more']);
  [...hud.querySelectorAll(':scope > button')].forEach(b=>{
    if(!keep.has(b.dataset.act||''))more.appendChild(b);
  });
  // dismiss the popover on any outside tap
  addEventListener('pointerdown',e=>{
    if(!e.target.closest('#hud'))more.classList.remove('open');
  },true);
})();
</script>
