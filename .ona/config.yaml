tasks:
  install-dependencies:
    name: Install dependencies
    description: Install Go modules and the documentation site's locked Node dependencies
    command: |
      go mod download
      npm ci --prefix docs-site
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build Vessica Studio
    description: Build the Go CLI and the documentation site
    command: |
      make build
      npm run build --prefix docs-site
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

  test:
    name: Run tests
    description: Run the Go test suite and documentation checks
    command: |
      go test ./...
      npm run check --prefix docs-site
    dependsOn:
      - build
    triggeredBy:
      - manual

services:
  docs-site:
    name: Docs site
    description: Astro development server for the Vessica Studio documentation
    commands:
      start: |
        ona environment port open 4321 --admission creator_only --name "Docs site"
        export ONA_EXPOSED_HOST="$(ona environment port get 4321 -f URL | cut -c 9-)"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST"
        npm run dev --prefix docs-site -- --host 0.0.0.0
      ready: curl -fsS http://localhost:4321/ >/dev/null
    triggeredBy:
      - manual
      - postEnvironmentStart
